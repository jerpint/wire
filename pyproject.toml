[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wire-agents"
version = "0.1.0"
description = "Let CLI coding agents talk to each other."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
wire = "wire:main"
wi = "wire:main"

# The shipped file has no .py extension so it can be curled and run directly.
# Install it under an importable name without keeping a second copy in the repo.
[tool.hatch.build.targets.wheel.force-include]
"wire" = "wire.py"
